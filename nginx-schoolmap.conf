# ==============================================================================
# Cấu hình Nginx cho Hệ thống Bản đồ số Giáo dục (SchoolMap)
# Đặt tại: /etc/nginx/sites-available/schoolmap
# ==============================================================================

server {
    listen 80;
    server_name ninhbinh.poly-hna.com;

    root /var/www/schoolmap/dist;
    index index.html;

    client_max_body_size 50M;

    # Bật nén Gzip tăng tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Frontend Vue 3 SPA (Tất cả URL client đẩy về index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend Laravel API (/api/*)
    location /api {
        root /var/www/schoolmap/backend/public;
        try_files $uri $uri/ @laravel;
    }

    # 3. Filament Admin Panel (/admin/*)
    location /admin {
        root /var/www/schoolmap/backend/public;
        try_files $uri $uri/ @laravel;
    }

    # 4. Livewire Component Routing (Filament Admin)
    location ^~ /livewire {
        root /var/www/schoolmap/backend/public;
        try_files $uri $uri/ @laravel;
    }

    # 5. Filament Published Assets (CSS, JS, Fonts - Tránh 404 trên SPA)
    location ^~ /css/filament/ {
        root /var/www/schoolmap/backend/public;
        access_log off;
        expires 30d;
    }

    location ^~ /js/filament/ {
        root /var/www/schoolmap/backend/public;
        access_log off;
        expires 30d;
    }

    location ^~ /fonts/filament/ {
        root /var/www/schoolmap/backend/public;
        access_log off;
        expires 30d;
    }

    # 6. File Upload / Ảnh trường học (/storage/*)
    location ^~ /storage {
        alias /var/www/schoolmap/backend/storage/app/public;
        access_log off;
        expires max;
    }

    # 7. Xử lý PHP Laravel qua Named Location
    location @laravel {
        root /var/www/schoolmap/backend/public;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/schoolmap/backend/public/index.php;
        include fastcgi_params;
    }

    location ~ \.php$ {
        root /var/www/schoolmap/backend/public;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/schoolmap/backend/public$fastcgi_script_name;
        include fastcgi_params;
    }

    # 8. Cache cho Static Assets của Frontend (JS, CSS, Font, Ảnh)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 9. Chặn truy cập các file nhạy cảm (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
